<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Social Media Dashboard</title>
<meta name="description" content="Track followers, engagement, and post performance across your social platforms — private, offline, and stored on your device." />
<meta name="theme-color" content="#0C0E1A" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<style>
  html { color-scheme: light dark; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    /* Light — soft neutrals + violet→sky brand accent */
    --ground: #F4F5FB;
    --surface: #FFFFFF;
    --surface-2: #F0F1F8;
    --surface-3: #E9EBF4;
    --ink: #171930;
    --muted: #5A5F73;
    --faint: #8A8FA3;
    --border: #E5E7F1;
    --border-strong: #D3D6E6;
    --accent: #6C5CE7;
    --accent-2: #3BAFEE;
    --accent-ink: #4B3FC0;
    --accent-soft: #ECEAFD;
    --good: #15925A;
    --good-soft: #E2F3EA;
    --warn: #B5730E;
    --warn-soft: #FBEFD8;
    --crit: #D23B36;
    --crit-soft: #FBE5E3;
    --shadow: 0 1px 2px rgba(23,25,48,.05), 0 6px 20px rgba(23,25,48,.06);
    --shadow-lg: 0 12px 40px rgba(23,25,48,.16);
    --radius: 16px;
    --radius-sm: 10px;
    --grad: linear-gradient(120deg, #6C5CE7, #3BAFEE);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #0B0D18;
      --surface: #14172A;
      --surface-2: #1B1F36;
      --surface-3: #232842;
      --ink: #E9EBF5;
      --muted: #A3A8C0;
      --faint: #71769A;
      --border: #262B45;
      --border-strong: #363C5E;
      --accent: #8E80FF;
      --accent-2: #56C7FB;
      --accent-ink: #B7AEFF;
      --accent-soft: #1D2140;
      --good: #3ECB84;
      --good-soft: #10281D;
      --warn: #E0A63E;
      --warn-soft: #2C2210;
      --crit: #F0655C;
      --crit-soft: #2E1512;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.32);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
      --grad: linear-gradient(120deg, #8E80FF, #56C7FB);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0B0D18;
    --surface: #14172A;
    --surface-2: #1B1F36;
    --surface-3: #232842;
    --ink: #E9EBF5;
    --muted: #A3A8C0;
    --faint: #71769A;
    --border: #262B45;
    --border-strong: #363C5E;
    --accent: #8E80FF;
    --accent-2: #56C7FB;
    --accent-ink: #B7AEFF;
    --accent-soft: #1D2140;
    --good: #3ECB84;
    --good-soft: #10281D;
    --warn: #E0A63E;
    --warn-soft: #2C2210;
    --crit: #F0655C;
    --crit-soft: #2E1512;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.32);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
    --grad: linear-gradient(120deg, #8E80FF, #56C7FB);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  a { color: var(--accent); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ---------- App shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    background: color-mix(in srgb, var(--ground) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-row { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: var(--grad); display: grid; place-items: center; box-shadow: var(--shadow);
  }
  .brand .logo svg { width: 20px; height: 20px; }
  .brand-txt { min-width: 0; }
  .brand-name { font-weight: 700; font-size: 15px; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 11.5px; color: var(--faint); line-height: 1.1; }
  .spacer { flex: 1 1 auto; }
  .icon-btn {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    transition: background .15s, border-color .15s, transform .05s;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Segmented period control */
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px;
    padding: 5px 11px; border-radius: 999px; transition: color .15s;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* Tab nav */
  .tabs { max-width: 1120px; margin: 12px auto 0; padding: 0 16px; display: flex; gap: 4px; }
  .tabs button {
    border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
    padding: 9px 4px; margin-right: 14px; border-bottom: 2px solid transparent; transition: color .15s;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 96px; }
  .view { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  section { margin-top: 20px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .sec-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .sec-head .rhs { margin-left: auto; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* KPI grid */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { padding: 15px 16px; position: relative; overflow: hidden; }
  .kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .kpi .label svg { width: 15px; height: 15px; color: var(--accent); }
  .kpi .val { font-size: 27px; font-weight: 750; letter-spacing: -.02em; margin-top: 7px; line-height: 1; }
  .kpi .val small { font-size: 15px; font-weight: 650; color: var(--muted); }
  .delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 700; margin-top: 9px; padding: 2px 7px 2px 5px; border-radius: 999px; }
  .delta svg { width: 13px; height: 13px; }
  .delta.up { color: var(--good); background: var(--good-soft); }
  .delta.down { color: var(--crit); background: var(--crit-soft); }
  .delta.flat { color: var(--muted); background: var(--surface-2); }

  /* Chart card */
  .chart-card { padding: 16px 16px 10px; }
  .chart-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .chart-top .big { font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  .chart-top .cap { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .chart-wrap { position: relative; }
  svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .chart-tip {
    position: absolute; pointer-events: none; z-index: 5; transform: translate(-50%, -100%);
    background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 8px;
    font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .1s;
  }
  .chart-tip b { font-weight: 750; }
  .chart-tip .t-date { display: block; font-size: 10.5px; color: color-mix(in srgb, var(--surface) 65%, var(--ink)); font-weight: 600; }

  /* Platform cards */
  .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pcard { padding: 14px 15px; display: flex; flex-direction: column; gap: 10px; }
  .pcard-head { display: flex; align-items: center; gap: 10px; }
  .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; }
  .badge svg { width: 19px; height: 19px; }
  .pcard-meta { min-width: 0; }
  .pcard-name { font-weight: 700; font-size: 14px; line-height: 1.1; }
  .pcard-handle { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard-figs { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .pcard-foll { font-size: 22px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  .pcard-foll span { font-size: 11.5px; font-weight: 600; color: var(--faint); display: block; margin-top: 3px; letter-spacing: 0; }
  .spark { width: 78px; height: 30px; flex: none; }
  .prog { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .prog > i { display: block; height: 100%; border-radius: 999px; }
  .goal-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: -2px; }

  .split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }

  /* Donut */
  .donut-card { padding: 16px; }
  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .donut { width: 132px; height: 132px; flex: none; }
  .donut-center { font-size: 12px; }
  .legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .legend-item { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .legend-item .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-item .lg-name { font-weight: 600; }
  .legend-item .lg-val { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Posts */
  .posts-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.posts { width: 100%; border-collapse: collapse; min-width: 620px; }
  table.posts th, table.posts td { text-align: right; padding: 11px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.posts th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 700; position: sticky; top: 0; }
  table.posts th:first-child, table.posts td:first-child { text-align: left; }
  table.posts th.sortable { cursor: pointer; user-select: none; }
  table.posts th.sortable:hover { color: var(--muted); }
  table.posts th .arrow { font-size: 9px; }
  table.posts tbody tr { transition: background .12s; }
  table.posts tbody tr:hover { background: var(--surface-2); }
  .post-cell { display: flex; align-items: center; gap: 10px; max-width: 320px; }
  .post-cap { min-width: 0; }
  .post-cap .cap-txt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .post-cap .cap-date { font-size: 11.5px; color: var(--faint); }
  .mini-badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .mini-badge svg { width: 15px; height: 15px; }
  .er-pill { font-variant-numeric: tabular-nums; font-weight: 700; padding: 2px 7px; border-radius: 999px; font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .row-actions { display: inline-flex; gap: 4px; }
  .row-actions button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--faint); display: grid; place-items: center; }
  .row-actions button:hover { background: var(--surface-3); color: var(--ink); }
  .row-actions svg { width: 15px; height: 15px; }

  /* Upcoming */
  .up-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .up-chip { flex: none; min-width: 190px; border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
  .up-chip .up-when { font-size: 11.5px; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .up-chip .up-when svg { width: 14px; height: 14px; flex: none; }
  .up-chip .up-cap { font-size: 13px; font-weight: 600; }
  .up-chip .up-plat { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .up-chip .up-plat .mini-badge { width: 18px; height: 18px; border-radius: 5px; }
  .up-chip .up-plat .mini-badge svg { width: 11px; height: 11px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    padding: 8px 13px; border-radius: 10px; font-weight: 650; font-size: 13.5px; transition: background .15s, transform .05s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; }
  .btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--border)); }
  .btn.danger:hover { background: var(--crit-soft); }

  .empty { text-align: center; padding: 42px 20px; color: var(--muted); }
  .empty svg { width: 40px; height: 40px; color: var(--faint); margin-bottom: 10px; }
  .empty h3 { font-size: 16px; color: var(--ink); margin-bottom: 6px; }

  /* Modal */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,24,.5); backdrop-filter: blur(2px); display: grid; place-items: end center; animation: fade .15s ease; }
  @media (min-width: 640px) { .scrim { place-items: center; } }
  .modal {
    width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
    padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); animation: rise .22s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width: 640px) { .modal { border-radius: 20px; } }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .modal-head h3 { font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  .modal-head .icon-btn { margin-left: auto; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 11px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .field textarea { resize: vertical; min-height: 62px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }
  .plat-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .plat-opt { border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--surface); font-size: 11.5px; font-weight: 600; transition: border-color .15s, background .15s; }
  .plat-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .plat-opt .mini-badge { width: 28px; height: 28px; }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row .st-txt { flex: 1; min-width: 0; }
  .settings-row .st-txt b { font-weight: 650; font-size: 14px; }
  .settings-row .st-txt p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .theme-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .theme-seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 999px; font-weight: 600; font-size: 12.5px; }
  .theme-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* FAB */
  .fab {
    position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 25;
    height: 52px; padding: 0 18px 0 16px; border-radius: 999px; border: 0; color: #fff; background: var(--accent);
    font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 26px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .08s;
  }
  .fab:active { transform: scale(.95); }
  .fab svg { width: 20px; height: 20px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom,0px) + 84px);
    z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .install-banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 14px; }
  .install-banner .st-txt { flex: 1; }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .grid-cards { grid-template-columns: 1fr; }
    .brand-sub { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="8" rx="1.2" fill="#fff"/><rect x="10" y="7" width="4" height="13" rx="1.2" fill="#fff"/><rect x="17" y="3" width="4" height="17" rx="1.2" fill="#fff"/></svg>
      </span>
      <div class="brand-txt">
        <div class="brand-name" id="brandName">Social Media Dashboard</div>
        <div class="brand-sub" id="brandSub">Your channels at a glance</div>
      </div>
    </div>
    <span class="spacer"></span>
    <div class="seg" id="periodSeg" role="group" aria-label="Time period">
      <button data-days="7">7d</button>
      <button data-days="30" aria-pressed="true">30d</button>
      <button data-days="90">90d</button>
      <button data-days="0">All</button>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">

<script>
(function () {
  "use strict";

  // ---------- Platform registry ----------

      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.1 1.5 3.4 3.5 3.6v2.6c-1.3.1-2.5-.3-3.5-1v6.3c0 4-3.3 6.6-6.9 5.8-3-.7-4.7-3.9-3.7-6.8.8-2.4 3.2-3.7 5.7-3.3v2.8c-.4-.1-.8-.2-1.3-.1-1.2.1-2 1-2 2.2 0 1.3 1.1 2.3 2.4 2.1 1.2-.2 1.9-1.1 1.9-2.4V3h3.9z"/></svg>' },

    facebook: { name: "Facebook", color: "#1877F2",

  };
  var PLATFORM_ORDER = ["instagram", "x", "tiktok", "youtube", "linkedin", "facebook"];

  // ---------- Icons ----------
  var I = {
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14l5-5 5 5"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>',
    dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
    install: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>'
  };

  // ---------- Storage ----------
  var KEY = "smdash.v1";
  var state = null;

  function todayISO() { return toISO(new Date()); }
  function toISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { state = JSON.parse(raw); return; }
    } catch (e) {}
    state = seed();
    save();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- Seed sample data ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seed() {
    var rnd = mulberry32(20260916);
    var accts = [
      { platform: "instagram", handle: "@studioaster", start: 8600, rate: 0.0042, goal: 15000 },
      { platform: "x", handle: "@studioaster", start: 5400, rate: 0.0028, goal: 8000 },
      { platform: "tiktok", handle: "@studio.aster", start: 12200, rate: 0.0075, goal: 25000 },
      { platform: "youtube", handle: "Studio Aster", start: 3100, rate: 0.0036, goal: 5000 }
    ];
    var N = 120;
    var start = addDays(new Date(), -N + 1);
    var snapshots = [];
    var running = {};
    accts.forEach(function (a) { running[a.platform] = a.start; });
    for (var i = 0; i < N; i++) {
      var d = toISO(addDays(start, i));
      var values = {};
      accts.forEach(function (a) {
        var noise = 1 + (rnd() - 0.45) * 0.006;
        running[a.platform] = running[a.platform] * (1 + a.rate) * noise;
        // occasional viral bump on tiktok
        if (a.platform === "tiktok" && rnd() > 0.97) running[a.platform] *= 1.03;
        values[a.platform] = Math.round(running[a.platform]);
      });
      snapshots.push({ date: d, values: values });
    }
    var accounts = accts.map(function (a) {
      return { platform: a.platform, handle: a.handle, followers: snapshots[N - 1].values[a.platform], goal: a.goal };
    });

    // posts over last ~85 days
    var captions = [
      "Behind the scenes of the spring shoot", "3 tips that changed how we work", "New drop is live — link in bio",
      "The making of our latest piece", "Answering your most-asked question", "A quick studio tour",
      "This took 40 hours. Worth it?", "Before / after — swipe to see", "Weekend mood board",
      "How we plan a month of content", "Our favorite tool right now", "Reply with your questions 👇",
      "Client work we can finally share", "The one mistake we kept making", "5 minutes of pure process",
      "Testing a new format, thoughts?", "Throwback to where it started", "What's on the desk today",
      "Little wins from this week", "A thread on staying consistent", "Unboxing the new gear",
      "Community spotlight ✨", "Timelapse: idea to finish", "We hit a milestone — thank you"
    ];
    var posts = [];
    var pid = 1;
    for (var j = 0; j < captions.length; j++) {
      var ago = Math.floor(rnd() * 84);
      var plat = accts[Math.floor(rnd() * accts.length)].platform;
      var base = snapshots[N - 1 - ago] ? snapshots[N - 1 - ago].values[plat] : accounts[0].followers;
      var reachMul = plat === "tiktok" ? (1.5 + rnd() * 6) : (0.35 + rnd() * 1.1);
      var reach = Math.round(base * reachMul);
      var erBase = 0.02 + rnd() * 0.06;
      var eng = Math.round(reach * erBase);
      var likes = Math.round(eng * (0.72 + rnd() * 0.15));
      var comments = Math.round(eng * (0.06 + rnd() * 0.08));
      var shares = Math.max(0, eng - likes - comments);
      posts.push({
        id: "p" + (pid++), platform: plat, date: toISO(addDays(new Date(), -ago)),
        caption: captions[j], reach: reach, likes: likes, comments: comments, shares: shares, status: "published"
      });
    }
    // upcoming / scheduled
    var upcoming = [
      { plat: "instagram", cap: "Q3 recap carousel", in: 1 },
      { plat: "tiktok", cap: "Trend remix (draft)", in: 2 },
      { plat: "youtube", cap: "Studio setup walkthrough", in: 4 }
    ];
    upcoming.forEach(function (u) {
      posts.push({ id: "p" + (pid++), platform: u.plat, date: toISO(addDays(new Date(), u.in)),
        caption: u.cap, reach: 0, likes: 0, comments: 0, shares: 0, status: "scheduled" });
    });

    return {
      brand: "Studio Aster", tagline: "Your channels at a glance",
      theme: "auto", accounts: accounts, snapshots: snapshots, posts: posts,
      sort: { key: "date", dir: -1 }, filter: "all"
    };
  }

  // ---------- Derived data ----------
  var period = 30; // 0 = all

  function snapForDate(iso) {
    // nearest snapshot on or before iso
    var best = null;
    for (var i = 0; i < state.snapshots.length; i++) {
      if (state.snapshots[i].date <= iso) best = state.snapshots[i]; else break;
    }
    return best || state.snapshots[0];
  }
  function periodStartISO() {
    if (!state.snapshots.length) return todayISO();
    if (!period) return state.snapshots[0].date;
    var s = toISO(addDays(new Date(), -period + 1));
    if (s < state.snapshots[0].date) return state.snapshots[0].date;
    return s;
  }
  function totalFollowers(values) {
    var t = 0; state.accounts.forEach(function (a) { t += (values[a.platform] || 0); }); return t;
  }
  function publishedInPeriod() {
    var startI = periodStartISO(), t = todayISO();
    return state.posts.filter(function (p) {
      return p.status === "published" && p.date >= startI && p.date <= t;
    });
  }
  function upcomingPosts() {
    var t = todayISO();
    return state.posts.filter(function (p) { return p.status === "scheduled" && p.date >= t; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }
  function engagement(p) { return (p.likes || 0) + (p.comments || 0) + (p.shares || 0); }
  function engRate(p) { return p.reach ? engagement(p) / p.reach * 100 : 0; }

  function kpis() {
    var latest = state.snapshots[state.snapshots.length - 1];
    var curValues = latest ? latest.values : {};
    var curFollowers = totalFollowers(curValues);
    var startSnap = snapForDate(periodStartISO());
    var startFollowers = totalFollowers(startSnap.values);
    var netFollowers = curFollowers - startFollowers;

    var posts = publishedInPeriod();
    var eng = 0, reach = 0;
    posts.forEach(function (p) { eng += engagement(p); reach += (p.reach || 0); });
    var avgER = reach ? eng / reach * 100 : 0;

    return {
      followers: curFollowers, netFollowers: netFollowers,
      followersPct: startFollowers ? netFollowers / startFollowers * 100 : 0,
      engagement: eng, reach: reach, avgER: avgER, posts: posts.length
    };
  }

  // ---------- Formatting ----------
  function fmt(n) {
    n = Math.round(n || 0);
    var abs = Math.abs(n);
    if (abs >= 1e6) return trim(n / 1e6) + "M";
    if (abs >= 1e4) return trim(n / 1e3) + "K";
    if (abs >= 1000) return n.toLocaleString();
    return "" + n;
  }
  function trim(x) {
    var s = x.toFixed(x < 10 && Math.abs(x % 1) > 0.05 ? 1 : (Math.abs(x) < 100 ? 1 : 0));
    return s.replace(/\.0$/, "");
  }
  function fmtFull(n) { return Math.round(n || 0).toLocaleString(); }
  function signed(n) { return (n > 0 ? "+" : "") + fmt(n); }
  function pct1(n) { return (n >= 0 ? "" : "") + n.toFixed(1) + "%"; }
  function relDate(iso) {
    var d = daysBetween(iso, todayISO());
    if (d === 0) return "Today";
    if (d === 1) return "Yesterday";
    if (d === -1) return "Tomorrow";
    if (d < 0) return "in " + (-d) + "d";
    if (d < 7) return d + "d ago";
    return parseISO(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s) { return (s || "").replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function platColor(p) { return (PLATFORMS[p] || {}).color || "#888"; }
  function platName(p) { return (PLATFORMS[p] || { name: p }).name; }
  function platIcon(p) { return (PLATFORMS[p] || {}).icon || ""; }

  function erColor(er) {
    if (er >= 6) return "var(--good)";
    if (er >= 3) return "var(--accent)";
    if (er >= 1.5) return "var(--warn)";
    return "var(--muted)";
  }
  function erBg(er) {
    if (er >= 6) return "var(--good-soft)";
    if (er >= 3) return "var(--accent-soft)";
    if (er >= 1.5) return "var(--warn-soft)";
    return "var(--surface-2)";
  }

  // ---------- Charts ----------
  function seriesForPeriod(platform) {
    // returns [{date, v}] within period; platform null = total
    var startI = periodStartISO();
    var pts = [];
    state.snapshots.forEach(function (s) {
      if (s.date < startI) return;
      pts.push({ date: s.date, v: platform ? (s.values[platform] || 0) : totalFollowers(s.values) });
    });
    return pts;
  }

  function areaChart(pts, opts) {
    opts = opts || {};
    var W = 720, H = 220, padL = 8, padR = 8, padT = 16, padB = 22;
    if (pts.length < 2) return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"></svg>';
    var min = Infinity, max = -Infinity;
    pts.forEach(function (p) { if (p.v < min) min = p.v; if (p.v > max) max = p.v; });
    var span = max - min || 1; min -= span * 0.12; max += span * 0.08;
    var iw = W - padL - padR, ih = H - padT - padB;
    var X = function (i) { return padL + (i / (pts.length - 1)) * iw; };
    var Y = function (v) { return padT + ih - ((v - min) / (max - min)) * ih; };
    var line = "", area = "";
    pts.forEach(function (p, i) {
      var x = X(i).toFixed(1), y = Y(p.v).toFixed(1);
      line += (i ? "L" : "M") + x + " " + y + " ";
    });
    area = line + "L" + X(pts.length - 1).toFixed(1) + " " + (padT + ih) + " L" + X(0).toFixed(1) + " " + (padT + ih) + " Z";
    var gid = "g" + Math.random().toString(36).slice(2, 8);
    // gridlines
    var grid = "";
    for (var g = 0; g <= 3; g++) {
      var gy = padT + (ih / 3) * g;
      grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="1 5"/>';
    }
    var pdata = pts.map(function (p, i) { return X(i).toFixed(1) + "|" + Y(p.v).toFixed(1) + "|" + p.date + "|" + p.v; }).join(";");
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" data-pts="' + pdata + '" data-h="' + H + '">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/>' +
      '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      grid +
      '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<g class="crosshair" style="opacity:0"><line stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<circle r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/></g>' +
      '</svg>';
  }

  function sparkline(pts, color) {
    var W = 78, H = 30, pad = 3;
    if (pts.length < 2) return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '"></svg>';
    var min = Infinity, max = -Infinity;
    pts.forEach(function (p) { if (p.v < min) min = p.v; if (p.v > max) max = p.v; });
    var rng = max - min || 1;
    var iw = W - pad * 2, ih = H - pad * 2;
    var d = "";
    pts.forEach(function (p, i) {
      var x = pad + (i / (pts.length - 1)) * iw;
      var y = pad + ih - ((p.v - min) / rng) * ih;
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    });
    var last = pts[pts.length - 1];
    var lx = pad + iw, ly = pad + ih - ((last.v - min) / rng) * ih;
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="2.6" fill="' + color + '"/></svg>';
  }

  function donut(segments) {
    var total = 0; segments.forEach(function (s) { total += s.value; });
    var R = 52, C = 66, sw = 16, circ = 2 * Math.PI * R;
    var off = 0, arcs = "";
    segments.forEach(function (s) {
      var frac = total ? s.value / total : 0;
      var len = frac * circ;
      arcs += '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="' + s.color +
        '" stroke-width="' + sw + '" stroke-dasharray="' + (len - 1.5).toFixed(2) + ' ' + (circ - len + 1.5).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + C + ' ' + C + ')" stroke-linecap="round"/>';
      off += len;
    });
    return '<svg class="donut" viewBox="0 0 132 132">' +
      '<circle cx="66" cy="66" r="52" fill="none" stroke="var(--surface-2)" stroke-width="16"/>' + arcs +
      '<text x="66" y="61" text-anchor="middle" font-size="20" font-weight="750" fill="var(--ink)">' + fmt(total) + '</text>' +
      '<text x="66" y="79" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">followers</text></svg>';
  }

  // ---------- Views ----------
  var currentView = "overview";
  var main = document.getElementById("main");

  function render() {
    if (currentView === "overview") renderOverview();
    else if (currentView === "content") renderContent();
    else renderAccounts();
    updateFab();
  }

  function updateFab() {
    var fab = document.getElementById("fab");
    var label = document.getElementById("fabLabel");
    if (currentView === "accounts") { label.textContent = "Add account"; }
    else { label.textContent = "Log post"; }
    fab.hidden = false;
  }

  function deltaPill(net, pct) {
    var cls = net > 0 ? "up" : net < 0 ? "down" : "flat";
    var ico = net > 0 ? I.up : net < 0 ? I.down : I.dot;
    var txt = signed(net) + (pct !== undefined && isFinite(pct) ? " · " + pct1(pct) : "");
    return '<span class="delta ' + cls + '">' + ico + txt + '</span>';
  }

  function renderOverview() {
    var k = kpis();
    var totalPts = seriesForPeriod(null);
    var latest = totalPts.length ? totalPts[totalPts.length - 1].v : k.followers;
    var periodLabel = period ? "last " + period + " days" : "all time";

    var v = el('<div class="view"></div>');

    // KPIs
    var kpiHtml =
      kpiCard(I.users, "Total followers", fmt(k.followers), deltaPill(k.netFollowers, k.followersPct)) +
      kpiCard(I.pulse, "Avg engagement", pct1(k.avgER), '<span class="delta flat">' + I.dot + 'per post</span>') +
      kpiCard(I.heart, "Engagement", fmt(k.engagement), '<span class="delta flat">' + I.dot + fmt(k.reach) + ' reach</span>') +
      kpiCard(I.grid, "Posts", "" + k.posts, '<span class="delta flat">' + I.dot + periodLabel + '</span>');
    v.appendChild(el('<section><div class="kpis">' + kpiHtml + '</div></section>'));

    // Growth chart
    var chart = el('<section><div class="card chart-card">' +
      '<div class="chart-top"><div><div class="big num">' + fmt(latest) + '</div>' +
      '<div class="cap">Total followers · ' + periodLabel + '</div></div>' +
      '<div style="margin-left:auto;text-align:right">' + deltaPill(k.netFollowers, k.followersPct) + '</div></div>' +
      '<div class="chart-wrap">' + areaChart(totalPts) + '<div class="chart-tip" id="chartTip"></div></div>' +
      '</div></section>');
    v.appendChild(chart);

    // Upcoming
    var up = upcomingPosts();
    if (up.length) {
      var chips = up.map(function (p) {
        return '<div class="up-chip"><div class="up-when">' + I.cal + relDate(p.date) + '</div>' +
          '<div class="up-cap">' + esc(p.caption) + '</div>' +
          '<div class="up-plat"><span class="mini-badge" style="background:' + platColor(p.platform) + '">' + platIcon(p.platform) + '</span>' + platName(p.platform) + '</div></div>';
      }).join("");
      v.appendChild(el('<section><div class="sec-head"><h2>Scheduled</h2></div><div class="up-strip">' + chips + '</div></section>'));
    }

    // Split: platform cards + donut
    var pcards = state.accounts.map(platformCard).join("");
    var segs = state.accounts.map(function (a) {
      return { name: platName(a.platform), value: a.followers, color: platColor(a.platform) };
    }).sort(function (x, y) { return y.value - x.value; });
    var total = segs.reduce(function (s, x) { return s + x.value; }, 0);
    var legend = segs.map(function (s) {
      return '<div class="legend-item"><span class="dot" style="background:' + s.color + '"></span>' +
        '<span class="lg-name">' + s.name + '</span>' +
        '<span class="lg-val">' + fmt(s.value) + ' · ' + (total ? Math.round(s.value / total * 100) : 0) + '%</span></div>';
    }).join("");

    var split = el('<section><div class="sec-head"><h2>By platform</h2></div>' +
      '<div class="split"><div class="grid-cards">' + pcards + '</div>' +
      '<div class="card donut-card"><div class="donut-wrap">' + donut(segs) + '<div class="legend">' + legend + '</div></div></div>' +
      '</div></section>');
    v.appendChild(split);

    // Top posts
    var top = publishedInPeriod().slice().sort(function (a, b) { return engRate(b) - engRate(a); }).slice(0, 5);
    if (top.length) {
      v.appendChild(el('<section><div class="sec-head"><h2>Top posts</h2>' +
        '<div class="rhs"><button class="btn ghost sm" data-goto="content">View all</button></div></div>' +
        '<div class="card posts-wrap">' + postsTable(top, false) + '</div></section>'));
    }

    // Install banner
    if (deferredPrompt && !isStandalone()) {
      v.appendChild(el('<section><div class="card install-banner">' +
        '<span class="badge" style="background:var(--grad)">' + I.install + '</span>' +
        '<div class="st-txt"><b>Install the dashboard</b><p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">Add to your home screen for full-screen, offline access.</p></div>' +
        '<button class="btn primary sm" id="installBtn">Install</button></div></section>'));
    }

    main.innerHTML = "";
    main.appendChild(v);
    wireOverview();
  }

  function kpiCard(icon, label, val, delta) {
    return '<div class="card kpi"><div class="label">' + icon + label + '</div>' +
      '<div class="val num">' + val + '</div>' + delta + '</div>';
  }

  function platformCard(a) {
    var pts = seriesForPeriod(a.platform);
    var startV = pts.length ? pts[0].v : a.followers;
    var net = a.followers - startV;
    var pctv = startV ? net / startV * 100 : 0;
    var goalPct = a.goal ? Math.min(100, a.followers / a.goal * 100) : 0;
    var cls = net > 0 ? "up" : net < 0 ? "down" : "flat";
    var ico = net > 0 ? I.up : net < 0 ? I.down : I.dot;
    return '<div class="card pcard">' +
      '<div class="pcard-head"><span class="badge" style="background:' + platColor(a.platform) + '">' + platIcon(a.platform) + '</span>' +
      '<div class="pcard-meta"><div class="pcard-name">' + platName(a.platform) + '</div>' +
      '<div class="pcard-handle">' + esc(a.handle || "") + '</div></div>' +
      '<span class="delta ' + cls + '" style="margin-left:auto">' + ico + signed(net) + '</span></div>' +
      '<div class="pcard-figs"><div class="pcard-foll num">' + fmt(a.followers) + '<span>' + pct1(pctv) + ' · ' + (period ? period + 'd' : 'all') + '</span></div>' +
      sparkline(pts, platColor(a.platform)) + '</div>' +
      (a.goal ? '<div><div class="goal-row"><span>Goal ' + fmt(a.goal) + '</span><span>' + Math.round(goalPct) + '%</span></div>' +
        '<div class="prog"><i style="width:' + goalPct + '%;background:' + platColor(a.platform) + '"></i></div></div>' : '') +
      '</div>';
  }

  function postsTable(posts, withActions) {
    var sort = state.sort;
    function th(key, label, sortable) {
      var arrow = sort.key === key ? '<span class="arrow">' + (sort.dir < 0 ? "▼" : "▲") + '</span>' : "";
      return '<th' + (sortable ? ' class="sortable" data-sort="' + key + '"' : '') + '>' + label + " " + arrow + '</th>';
    }
    var head = '<thead><tr>' + th("caption", "Post", true) +
      th("reach", "Reach", true) + th("likes", "Likes", true) +
      th("comments", "Comments", true) + th("shares", "Shares", true) +
      th("er", "Eng. rate", true) + (withActions ? '<th></th>' : '') + '</tr></thead>';
    var rows = posts.map(function (p) {
      var er = engRate(p);
      return '<tr data-id="' + p.id + '">' +
        '<td><div class="post-cell"><span class="mini-badge" style="background:' + platColor(p.platform) + '">' + platIcon(p.platform) + '</span>' +
        '<div class="post-cap"><div class="cap-txt">' + esc(p.caption) + '</div><div class="cap-date">' + relDate(p.date) + '</div></div></div></td>' +
        '<td class="num">' + fmtFull(p.reach) + '</td>' +
        '<td class="num">' + fmtFull(p.likes) + '</td>' +
        '<td class="num">' + fmtFull(p.comments) + '</td>' +
        '<td class="num">' + fmtFull(p.shares) + '</td>' +
        '<td><span class="er-pill" style="color:' + erColor(er) + ';background:' + erBg(er) + '">' + er.toFixed(1) + '%</span></td>' +
        (withActions ? '<td><div class="row-actions"><button data-edit="' + p.id + '" title="Edit">' + I.edit + '</button>' +
          '<button data-del="' + p.id + '" title="Delete">' + I.trash + '</button></div></td>' : '') +
        '</tr>';
    }).join("");
    return '<table class="posts">' + head + '<tbody>' + rows + '</tbody></table>';
  }

  function sortPosts(posts) {
    var s = state.sort;
    return posts.slice().sort(function (a, b) {
      var av, bv;
      if (s.key === "caption") { av = a.date; bv = b.date; }
      else if (s.key === "er") { av = engRate(a); bv = engRate(b); }
      else { av = a[s.key]; bv = b[s.key]; }
      if (av < bv) return -s.dir; if (av > bv) return s.dir; return 0;
    });
  }

  function renderContent() {
    var v = el('<div class="view"></div>');
    var startI = periodStartISO(), t = todayISO();
    var pool = state.posts.filter(function (p) { return p.status === "published"; });
    if (state.filter !== "all") pool = pool.filter(function (p) { return p.platform === state.filter; });
    pool = pool.filter(function (p) { return p.date >= startI && p.date <= t; });
    var sorted = sortPosts(pool);

    // filter chips
    var chips = '<button class="btn sm ' + (state.filter === "all" ? "primary" : "ghost") + '" data-filter="all">All</button>';
    state.accounts.forEach(function (a) {
      chips += '<button class="btn sm ' + (state.filter === a.platform ? "primary" : "ghost") + '" data-filter="' + a.platform + '">' + platName(a.platform) + '</button>';
    });

    var totals = { reach: 0, eng: 0 };
    pool.forEach(function (p) { totals.reach += p.reach; totals.eng += engagement(p); });
    var avgER = totals.reach ? totals.eng / totals.reach * 100 : 0;

    v.appendChild(el('<section><div class="sec-head"><h2>Published posts</h2>' +
      '<div class="rhs" style="display:flex;gap:6px;flex-wrap:wrap">' + chips + '</div></div>' +
      '<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">' +
      kpiCard(I.grid, "Posts", "" + pool.length, '<span class="delta flat">' + I.dot + (period ? period + "d" : "all time") + '</span>') +
      kpiCard(I.eye, "Total reach", fmt(totals.reach), '<span class="delta flat">' + I.dot + fmt(totals.eng) + ' engagements</span>') +
      kpiCard(I.pulse, "Avg eng. rate", pct1(avgER), '<span class="delta flat">' + I.dot + 'across posts</span>') +
      '</div>' +
      (pool.length ? '<div class="card posts-wrap">' + postsTable(sorted, true) + '</div>'
        : '<div class="card empty">' + I.grid + '<h3>No posts in this period</h3><p>Log a post or widen the time range to see performance here.</p></div>') +
      '</section>'));

    main.innerHTML = ""; main.appendChild(v);
    wireContent();
  }

  function renderAccounts() {
    var v = el('<div class="view"></div>');
    var cards = state.accounts.map(function (a) {
      var pts = seriesForPeriod(a.platform);
      var startV = pts.length ? pts[0].v : a.followers;
      var net = a.followers - startV;
      var goalPct = a.goal ? Math.min(100, a.followers / a.goal * 100) : 0;
      return '<div class="card pcard">' +
        '<div class="pcard-head"><span class="badge" style="background:' + platColor(a.platform) + '">' + platIcon(a.platform) + '</span>' +
        '<div class="pcard-meta"><div class="pcard-name">' + platName(a.platform) + '</div><div class="pcard-handle">' + esc(a.handle || "") + '</div></div>' +
        '<div class="row-actions" style="margin-left:auto"><button data-eacct="' + a.platform + '" title="Edit">' + I.edit + '</button>' +
        '<button data-dacct="' + a.platform + '" title="Remove">' + I.trash + '</button></div></div>' +
        '<div class="pcard-figs"><div class="pcard-foll num">' + fmtFull(a.followers) + '<span>followers · ' + signed(net) + ' this period</span></div>' +
        sparkline(pts, platColor(a.platform)) + '</div>' +
        (a.goal ? '<div><div class="goal-row"><span>Goal ' + fmtFull(a.goal) + '</span><span>' + Math.round(goalPct) + '%</span></div>' +
          '<div class="prog"><i style="width:' + goalPct + '%;background:' + platColor(a.platform) + '"></i></div></div>' : '') +
        '</div>';
    }).join("");

    v.appendChild(el('<section><div class="sec-head"><h2>Connected accounts</h2></div>' +
      (state.accounts.length ? '<div class="grid-cards">' + cards + '</div>'
        : '<div class="card empty">' + I.users + '<h3>No accounts yet</h3><p>Add a platform to start tracking followers and growth.</p></div>') +
      '<p style="font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5">Follower counts update the growth chart when you edit them. All data lives on this device — nothing is uploaded.</p>' +
      '</section>'));

    main.innerHTML = ""; main.appendChild(v);
    wireAccounts();
  }

  // ---------- Wiring ----------
  function wireOverview() {
    var tip = document.getElementById("chartTip");
    var svg = main.querySelector("svg.chart[data-pts]");
    if (svg && tip) wireChart(svg, tip);
    main.querySelectorAll("[data-goto]").forEach(function (b) {
      b.addEventListener("click", function () { switchView(b.getAttribute("data-goto")); });
    });
    var ib = document.getElementById("installBtn");
    if (ib) ib.addEventListener("click", doInstall);
  }

  function wireChart(svg, tip) {
    var pts = svg.getAttribute("data-pts").split(";").map(function (s) {
      var a = s.split("|"); return { x: +a[0], y: +a[1], date: a[2], v: +a[3] };
    });
    var cross = svg.querySelector(".crosshair");
    var line = cross.querySelector("line");
    var circ = cross.querySelector("circle");
    var VBH = +svg.getAttribute("data-h");
    function move(clientX) {
      var r = svg.getBoundingClientRect();
      var rel = (clientX - r.left) / r.width * 720;
      var best = 0, bd = Infinity;
      for (var i = 0; i < pts.length; i++) { var d = Math.abs(pts[i].x - rel); if (d < bd) { bd = d; best = i; } }
      var p = pts[best];
      cross.style.opacity = "1";
      line.setAttribute("x1", p.x); line.setAttribute("x2", p.x);
      line.setAttribute("y1", 8); line.setAttribute("y2", VBH - 18);
      circ.setAttribute("cx", p.x); circ.setAttribute("cy", p.y);
      var px = p.x / 720 * r.width;
      var py = p.y / VBH * r.height;
      tip.style.left = px + "px"; tip.style.top = (py - 10) + "px"; tip.style.opacity = "1";
      tip.innerHTML = '<span class="t-date">' + parseISO(p.date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + '</span><b>' + fmtFull(p.v) + '</b> followers';
    }
    function leave() { cross.style.opacity = "0"; tip.style.opacity = "0"; }
    svg.addEventListener("mousemove", function (e) { move(e.clientX); });
    svg.addEventListener("mouseleave", leave);
    svg.addEventListener("touchstart", function (e) { move(e.touches[0].clientX); }, { passive: true });
    svg.addEventListener("touchmove", function (e) { move(e.touches[0].clientX); }, { passive: true });
    svg.addEventListener("touchend", leave);
  }

  function wireContent() {
    main.querySelectorAll("[data-filter]").forEach(function (b) {
      b.addEventListener("click", function () { state.filter = b.getAttribute("data-filter"); save(); renderContent(); });
    });
    main.querySelectorAll("th[data-sort]").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-sort");
        if (state.sort.key === key) state.sort.dir *= -1;
        else state.sort = { key: key, dir: key === "caption" ? -1 : -1 };
        save(); renderContent();
      });
    });
    main.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () { openPostModal(b.getAttribute("data-edit")); });
    });
    main.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { deletePost(b.getAttribute("data-del")); });
    });
  }

  function wireAccounts() {
    main.querySelectorAll("[data-eacct]").forEach(function (b) {
      b.addEventListener("click", function () { openAccountModal(b.getAttribute("data-eacct")); });
    });
    main.querySelectorAll("[data-dacct]").forEach(function (b) {
      b.addEventListener("click", function () { deleteAccount(b.getAttribute("data-dacct")); });
    });
  }

  // ---------- Mutations ----------
  function setFollowers(platform, followers) {
    var a = state.accounts.find(function (x) { return x.platform === platform; });
    if (!a) return;
    a.followers = followers;
    // update / append today's snapshot
    var today = todayISO();
    var snap = state.snapshots[state.snapshots.length - 1];
    if (!snap || snap.date !== today) {
      var values = {};
      state.accounts.forEach(function (x) { values[x.platform] = x.followers; });
      // carry last known for platforms
      if (snap) for (var k in snap.values) if (!(k in values)) values[k] = snap.values[k];
      state.snapshots.push({ date: today, values: values });
    } else {
      snap.values[platform] = followers;
    }
  }

  function deletePost(id) {
    var p = state.posts.find(function (x) { return x.id === id; });
    if (!p) return;
    if (!confirm("Delete this post?\n\n" + p.caption)) return;
    state.posts = state.posts.filter(function (x) { return x.id !== id; });
    save(); render(); toast("Post deleted");
  }

  function deleteAccount(platform) {
    if (!confirm("Remove " + platName(platform) + "? Its posts are kept but it won't be tracked.")) return;
    state.accounts = state.accounts.filter(function (x) { return x.platform !== platform; });
    save(); render(); toast(platName(platform) + " removed");
  }

  // ---------- Modals ----------
  var modalRoot = document.getElementById("modalRoot");
  function closeModal() { modalRoot.innerHTML = ""; }
  function openModal(node) {
    var scrim = el('<div class="scrim"></div>');
    scrim.appendChild(node);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) closeModal(); });
    modalRoot.innerHTML = ""; modalRoot.appendChild(scrim);
    var first = node.querySelector("input,select,textarea,button");
    // don't autofocus on mobile to avoid keyboard jump; focus close otherwise
  }

  function openPostModal(id) {
    var editing = id ? state.posts.find(function (p) { return p.id === id; }) : null;
    var platOpts = state.accounts.length ? state.accounts : PLATFORM_ORDER.map(function (p) { return { platform: p }; });
    var sel = editing ? editing.platform : (platOpts[0] ? platOpts[0].platform : "instagram");
    var picker = platOpts.map(function (a) {
      return '<button type="button" class="plat-opt" data-plat="' + a.platform + '" aria-pressed="' + (a.platform === sel) + '">' +
        '<span class="mini-badge" style="background:' + platColor(a.platform) + '">' + platIcon(a.platform) + '</span>' + platName(a.platform) + '</button>';
    }).join("");
    var m = el('<div class="modal">' +
      '<div class="modal-head"><h3>' + (editing ? "Edit post" : "Log a post") + '</h3>' +
      '<button class="icon-btn" data-close>' + I.close + '</button></div>' +
      '<div class="field"><label>Platform</label><div class="plat-pick">' + picker + '</div></div>' +
      '<div class="field"><label>Caption / title</label><textarea id="f-cap" placeholder="What was this post about?">' + (editing ? esc(editing.caption) : "") + '</textarea></div>' +
      '<div class="field-row"><div class="field"><label>Date</label><input type="date" id="f-date" value="' + (editing ? editing.date : todayISO()) + '"></div>' +
      '<div class="field"><label>Reach</label><input type="number" min="0" id="f-reach" value="' + (editing ? editing.reach : "") + '" placeholder="0"></div></div>' +
      '<div class="field-row-3"><div class="field"><label>Likes</label><input type="number" min="0" id="f-likes" value="' + (editing ? editing.likes : "") + '" placeholder="0"></div>' +
      '<div class="field"><label>Comments</label><input type="number" min="0" id="f-comments" value="' + (editing ? editing.comments : "") + '" placeholder="0"></div>' +
      '<div class="field"><label>Shares</label><input type="number" min="0" id="f-shares" value="' + (editing ? editing.shares : "") + '" placeholder="0"></div></div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:2px 0 4px;cursor:pointer"><input type="checkbox" id="f-sched" style="width:auto" ' + (editing && editing.status === "scheduled" ? "checked" : "") + '> Scheduled (not yet published)</label>' +
      '<div class="modal-actions">' + (editing ? '<button class="btn danger" data-delete>Delete</button>' : '') +
      '<button class="btn primary" data-save>' + (editing ? "Save changes" : "Log post") + '</button></div>' +
      '</div>');

    var chosen = sel;
    m.querySelectorAll(".plat-opt").forEach(function (b) {
      b.addEventListener("click", function () {
        chosen = b.getAttribute("data-plat");
        m.querySelectorAll(".plat-opt").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
    });
    m.querySelector("[data-close]").addEventListener("click", closeModal);
    var delBtn = m.querySelector("[data-delete]");
    if (delBtn) delBtn.addEventListener("click", function () { closeModal(); deletePost(id); });
    m.querySelector("[data-save]").addEventListener("click", function () {
      var cap = m.querySelector("#f-cap").value.trim();
      if (!cap) { m.querySelector("#f-cap").focus(); return; }
      var data = {
        platform: chosen, caption: cap, date: m.querySelector("#f-date").value || todayISO(),
        reach: +m.querySelector("#f-reach").value || 0, likes: +m.querySelector("#f-likes").value || 0,
        comments: +m.querySelector("#f-comments").value || 0, shares: +m.querySelector("#f-shares").value || 0,
        status: m.querySelector("#f-sched").checked ? "scheduled" : "published"
      };
      if (editing) { Object.assign(editing, data); toast("Post updated"); }
      else { data.id = "p" + Date.now(); state.posts.push(data); toast("Post logged"); }
      save(); closeModal(); render();
    });
    openModal(m);
  }

  function openAccountModal(platform) {
    var editing = platform ? state.accounts.find(function (a) { return a.platform === platform; }) : null;
    var used = state.accounts.map(function (a) { return a.platform; });
    var avail = PLATFORM_ORDER.filter(function (p) { return editing ? true : used.indexOf(p) < 0; });
    if (!editing && !avail.length) { toast("All platforms already added"); return; }
    var sel = editing ? editing.platform : avail[0];
    var picker = (editing ? [editing.platform] : avail).map(function (p) {
      return '<button type="button" class="plat-opt" data-plat="' + p + '" aria-pressed="' + (p === sel) + '"' + (editing ? ' disabled style="opacity:.7"' : '') + '>' +
        '<span class="mini-badge" style="background:' + platColor(p) + '">' + platIcon(p) + '</span>' + platName(p) + '</button>';
    }).join("");
    var m = el('<div class="modal">' +
      '<div class="modal-head"><h3>' + (editing ? "Edit account" : "Add account") + '</h3>' +
      '<button class="icon-btn" data-close>' + I.close + '</button></div>' +
      '<div class="field"><label>Platform</label><div class="plat-pick">' + picker + '</div></div>' +
      '<div class="field"><label>Handle / name</label><input id="a-handle" value="' + (editing ? esc(editing.handle) : "") + '" placeholder="@yourhandle"></div>' +
      '<div class="field-row"><div class="field"><label>Followers</label><input type="number" min="0" id="a-foll" value="' + (editing ? editing.followers : "") + '" placeholder="0"></div>' +
      '<div class="field"><label>Goal (optional)</label><input type="number" min="0" id="a-goal" value="' + (editing && editing.goal ? editing.goal : "") + '" placeholder="—"></div></div>' +
      '<div class="modal-actions"><button class="btn primary" data-save>' + (editing ? "Save changes" : "Add account") + '</button></div>' +
      '</div>');
    var chosen = sel;
    m.querySelectorAll(".plat-opt").forEach(function (b) {
      if (editing) return;
      b.addEventListener("click", function () {
        chosen = b.getAttribute("data-plat");
        m.querySelectorAll(".plat-opt").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
    });
    m.querySelector("[data-close]").addEventListener("click", closeModal);
    m.querySelector("[data-save]").addEventListener("click", function () {
      var foll = +m.querySelector("#a-foll").value || 0;
      var goal = +m.querySelector("#a-goal").value || 0;
      var handle = m.querySelector("#a-handle").value.trim();
      if (editing) {
        editing.handle = handle; editing.goal = goal;
        setFollowers(editing.platform, foll);
        toast("Account updated");
      } else {
        state.accounts.push({ platform: chosen, handle: handle, followers: foll, goal: goal });
        setFollowers(chosen, foll);
        toast(platName(chosen) + " added");
      }
      save(); closeModal(); render();
    });
    openModal(m);
  }

  function openSettings() {
    var t = state.theme || "auto";
    var m = el('<div class="modal">' +
      '<div class="modal-head"><h3>Settings</h3><button class="icon-btn" data-close>' + I.close + '</button></div>' +
      '<div class="field"><label>Brand / profile name</label><input id="s-brand" value="' + esc(state.brand) + '"></div>' +
      '<div class="field"><label>Subtitle</label><input id="s-tag" value="' + esc(state.tagline || "") + '"></div>' +
      '<div class="settings-row"><div class="st-txt"><b>Appearance</b><p>Match your system or pick a theme.</p></div>' +
      '<div class="theme-seg" id="themeSeg"><button data-t="auto" aria-pressed="' + (t === "auto") + '">Auto</button>' +
      '<button data-t="light" aria-pressed="' + (t === "light") + '">Light</button>' +
      '<button data-t="dark" aria-pressed="' + (t === "dark") + '">Dark</button></div></div>' +
      '<div class="settings-row"><div class="st-txt"><b>Export data</b><p>Download a JSON backup of everything.</p></div>' +
      '<button class="btn sm" data-export>' + I.download + 'Export</button></div>' +
      '<div class="settings-row"><div class="st-txt"><b>Import data</b><p>Restore from a JSON backup.</p></div>' +
      '<button class="btn sm" data-import>' + I.upload + 'Import</button></div>' +
      '<div class="settings-row"><div class="st-txt"><b>Reset</b><p>Clear everything and reload sample data.</p></div>' +
      '<button class="btn sm danger" data-reset>Reset</button></div>' +
      '<p style="font-size:12px;color:var(--faint);margin:14px 0 0;line-height:1.5">This dashboard is private and works offline. Your accounts, posts, and history are stored only in this browser on this device.</p>' +
      '<input type="file" id="importFile" accept="application/json,.json" hidden>' +
      '</div>');
    m.querySelector("[data-close]").addEventListener("click", closeModal);
    m.querySelector("#s-brand").addEventListener("input", function () { state.brand = this.value; applyBrand(); save(); });
    m.querySelector("#s-tag").addEventListener("input", function () { state.tagline = this.value; applyBrand(); save(); });
    m.querySelectorAll("#themeSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        state.theme = b.getAttribute("data-t"); save(); applyTheme();
        m.querySelectorAll("#themeSeg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
    });
    m.querySelector("[data-export]").addEventListener("click", exportData);
    var fileInput = m.querySelector("#importFile");
    m.querySelector("[data-import]").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      var f = fileInput.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var data = JSON.parse(r.result);
          if (!data.accounts || !data.snapshots || !data.posts) throw new Error("bad");
          state = data; if (!state.sort) state.sort = { key: "date", dir: -1 }; if (!state.filter) state.filter = "all";
          save(); closeModal(); applyBrand(); applyTheme(); render(); toast("Data imported");
        } catch (e) { toast("Couldn't read that file"); }
      };
      r.readAsText(f);
    });
    m.querySelector("[data-reset]").addEventListener("click", function () {
      if (!confirm("Reset the dashboard? This clears your data and reloads the sample.")) return;
      state = seed(); save(); closeModal(); applyBrand(); applyTheme(); render(); toast("Reset to sample data");
    });
    openModal(m);
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "social-dashboard-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("Backup downloaded");
  }

  // ---------- Chrome ----------
  function applyTheme() {
    var t = state.theme || "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0B0D18" : "#F4F5FB");
  }
  function applyBrand() {
    document.getElementById("brandName").textContent = state.brand || "Social Media Dashboard";
    document.getElementById("brandSub").textContent = state.tagline || "Your channels at a glance";
    document.title = (state.brand ? state.brand + " · " : "") + "Social Media Dashboard";
  }

  var VIEWS = ["overview", "content", "accounts"];
  function switchView(view) {
    if (VIEWS.indexOf(view) < 0) view = "overview";
    currentView = view;
    document.querySelectorAll("#tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-view") === view);
    });
    if (("#" + view) !== location.hash) {
      try { history.replaceState(null, "", "#" + view); } catch (e) { location.hash = view; }
    }
    window.scrollTo({ top: 0, behavior: "auto" });
    render();
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- PWA install ----------
  var deferredPrompt = null;
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredPrompt = e;
    if (currentView === "overview") render();
  });
  function doInstall() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () { deferredPrompt = null; render(); });
  }
  window.addEventListener("appinstalled", function () { deferredPrompt = null; toast("Installed — launch from your home screen"); });

  // ---------- Boot ----------
  load();
  if (!state.sort) state.sort = { key: "date", dir: -1 };
  if (!state.filter) state.filter = "all";
  applyTheme();
  applyBrand();

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]"); if (b) switchView(b.getAttribute("data-view"));
  });
  document.getElementById("periodSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-days]"); if (!b) return;
    period = +b.getAttribute("data-days");
    document.querySelectorAll("#periodSeg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    render();
  });
  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("fab").addEventListener("click", function () {
    if (currentView === "accounts") openAccountModal(null);
    else openPostModal(null);
  });
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { if ((state.theme || "auto") === "auto") applyTheme(); });
  }
  window.addEventListener("hashchange", function () {
    var v = (location.hash || "").replace("#", "");
    if (VIEWS.indexOf(v) >= 0 && v !== currentView) switchView(v);
  });

  var initView = (location.hash || "").replace("#", "");
  if (VIEWS.indexOf(initView) >= 0) switchView(initView);
  else render();

  // Service worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
